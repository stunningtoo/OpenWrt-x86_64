name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/stunningtoo/lede
  REPO_BRANCH: master
  UPSTREAM_REPO: coolsnowwolf/lede
  UPSTREAM_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    permissions:
      contents: write
      actions: write
      # the compile step posts disk samples to an issue; the log itself is lost
      # when the runner fills the disk
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        set -euo pipefail
        before=$(df --output=avail -BM / | tail -1 | tr -d ' M')
        # The hosted image ships ~30G of toolchains this build never touches and
        # the OpenWrt tree eats more than that: run 40287701385 got 42G and still
        # hit "no space left on device" three hours in, which surfaces as a bare
        # "failed to build" for whichever package was writing at that moment.
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift \
                    /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
                    /opt/hostedtoolcache /usr/local/lib/node_modules \
                    /usr/local/share/chromium /opt/microsoft /opt/az \
                    /opt/google /usr/lib/jvm /usr/lib/mono /usr/lib/R \
                    /usr/local/aws-cli /usr/local/aws /usr/local/go \
                    /usr/local/share/powershell /usr/local/share/gecko_driver \
                    /usr/share/miniconda /imagegeneration || true
        sudo apt-get -qq clean || true
        sudo rm -rf /var/lib/apt/lists/* || true
        sudo docker image prune --all --force || true
        echo "=== biggest trees left on the runner ==="
        sudo du -sh /usr/local /usr/lib /usr/share /opt /var /home 2>/dev/null | sort -h | tail -6 || true
        after=$(df --output=avail -BM / | tail -1 | tr -d ' M')
        echo "free space before: ${before} MB, after: ${after} MB"
        df -hT /

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail
        sudo apt-get -qq update
        sudo apt-get -qq install --no-install-recommends \
          build-essential asciidoc binutils bzip2 gawk gettext \
          libncurses-dev libz-dev patch python3 unzip zlib1g-dev \
          libc6-dev-i386 subversion flex uglifyjs gcc-multilib \
          p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev \
          xmlto qemu-utils upx libelf-dev autoconf automake libtool \
          autopoint device-tree-compiler ccache
        sudo apt-get -qq autoremove --purge
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
    - name: Create working directory
      run: |
        set -euo pipefail
        df -hT
        # / on a hosted runner is small (~14G free); the OpenWrt tree plus dl/
        # needs 25G+. Put it on whichever of / or /mnt has more headroom.
        mnt_free=$(df --output=avail -BM /mnt 2>/dev/null | tail -1 | tr -d ' M' || echo 0)
        root_free=$(df --output=avail -BM / | tail -1 | tr -d ' M')
        if [ "${mnt_free:-0}" -gt "${root_free:-0}" ]; then
          base=/mnt/workdir
        else
          base=/workdir
        fi
        sudo mkdir -p "$base"
        sudo chown "$USER":"$USER" "$base"
        [ "$base" = /workdir ] || sudo ln -sfn "$base" /workdir
        echo "build root: $base ($(df --output=avail -h "$base" | tail -1 | xargs) free)"
        df -hT / /mnt 2>/dev/null || true

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      #uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      #env:
        #TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        #TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Pre-flight oxidns-core
      # The parallel compile pass swallows per-package output, so a bad recipe
      # here would only resurface as a nameless "failed to build" hours later.
      # A package target cannot be built on its own though: package/libs/toolchain
      # wants staging_dir/toolchain-*/lib/ld-musl-*.so*, which only appears after
      # tools/install and toolchain/install. Build those first (the main pass then
      # reuses them), so the verbose package build below actually runs.
      run: |
        cd openwrt
        # Cheap first: unpacking needs no cross toolchain and dies in seconds if
        # the tarball layout and the recipe disagree.
        make package/oxidns-core/prepare V=s
        ls -l build_dir/target-x86_64_musl/oxidns-core-1.6.1 | head -8
        make -j$(nproc) tools/install
        make -j$(nproc) toolchain/install
        df -hT / | tail -1
        echo "::group::oxidns-core verbose build"
        if ! make package/oxidns-core/compile V=s -j1; then
          echo "::error::oxidns-core failed to compile - see the group above"
          exit 1
        fi
        echo "::endgroup::"
        ls -l build_dir/target-x86_64_musl/oxidns-core*/ipkg-install/usr/bin/ 2>/dev/null || true

    - name: Compile the firmware
      id: compile
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        df -hT / | tail -1
        du -sh dl staging_dir build_dir tmp 2>/dev/null || true
        # The cross toolchain build trees are dead weight once it is staged: the
        # phase stamp lives in staging_dir/toolchain-*/stamp and only toolchain/*
        # makefiles ever look inside build_dir/toolchain-*.
        du -sh build_dir/toolchain-* 2>/dev/null | sort -h | tail -3 || true
        rm -rf build_dir/toolchain-* 2>/dev/null || true
        df -hT / | tail -1
        # A runner that fills up dies without uploading any log (the run shows
        # "log not found"), taking every diagnostic line with it. Post samples to
        # a tracking issue instead, where they outlive the crash.
        ISS=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=ci-disk&per_page=1" --jq '.[0].number // empty' 2>/dev/null || true)
        if [ -z "${ISS:-}" ]; then
          ISS=$(gh api "repos/$GITHUB_REPOSITORY/issues" \
                  -f title="CI disk telemetry" \
                  -f body="build-openwrt.yml 编译步骤自动追加的磁盘采样，用来定位 runner 磁盘写满（ENOSPC）。" \
                  -f "labels[]=ci-disk" --jq .number 2>/dev/null || true)
        fi
        echo "telemetry issue: ${ISS:-unavailable}"
        (
          while true; do
            sleep 600
            freeg=$(df --output=avail -BM / | tail -1 | tr -d ' M')
            freeg=$((freeg / 1024))
            sample="$(date -u +%H:%M:%SZ) free=${freeg}G dl=$(du -sh dl 2>/dev/null | cut -f1) staging=$(du -sh staging_dir 2>/dev/null | cut -f1) build=$(du -sh build_dir 2>/dev/null | cut -f1) tmp=$(du -sh tmp 2>/dev/null | cut -f1)"
            echo "$sample"
            if [ -n "${ISS:-}" ]; then
              gh api "repos/$GITHUB_REPOSITORY/issues/$ISS/comments" -f body="$sample" >/dev/null 2>&1 || true
            fi
          done
        ) &
        # One retry only: a third pass on a full disk just burns another 2h.
        if ! make -j$(nproc); then
          # The parallel pass swallows per-package output, so a failure arrives as
          # a one-line "failed to build" with no reason (that is how oxidns-core
          # died 1.5s in). Replay that package alone, verbosely, before the retry.
          echo "::group::diagnose oxidns-core"
          make package/oxidns-core/compile V=s -j1 2>&1 | tail -150 || true
          df -hT / | tail -1
          echo "::endgroup::"
          make -j1 V=s
        fi
        echo "status=success" >> "$GITHUB_OUTPUT"
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Mark upstream as built
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        set -euo pipefail

        LATEST_SHA=$(gh api "repos/$UPSTREAM_REPO/commits/$UPSTREAM_BRANCH" \
          --jq '.sha')

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -f -a upstream-tracker -m "$LATEST_SHA"
        git push -f origin upstream-tracker
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
        touch release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.1.0
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        #delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
