name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/stunningtoo/lede
  REPO_BRANCH: master
  UPSTREAM_REPO: coolsnowwolf/lede
  UPSTREAM_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    permissions:
      contents: write
      actions: write
      # the compile step posts disk samples to an issue; the log itself is lost
      # when the runner fills the disk
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        set -euo pipefail
        before=$(df --output=avail -BM / | tail -1 | tr -d ' M')
        # The hosted image ships ~30G of toolchains this build never touches and
        # the OpenWrt tree eats more than that: run 40287701385 got 42G and still
        # hit "no space left on device" three hours in, which surfaces as a bare
        # "failed to build" for whichever package was writing at that moment.
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift \
                    /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
                    /opt/hostedtoolcache /usr/local/lib/node_modules \
                    /usr/local/share/chromium /opt/microsoft /opt/az \
                    /opt/google /usr/lib/jvm /usr/lib/mono /usr/lib/R \
                    /usr/local/aws-cli /usr/local/aws /usr/local/go \
                    /usr/local/share/powershell /usr/local/share/gecko_driver \
                    /usr/share/miniconda /imagegeneration || true
        sudo apt-get -qq clean || true
        sudo rm -rf /var/lib/apt/lists/* || true
        sudo docker image prune --all --force || true
        # Second pass: tool caches and vendor SDKs the image carries for other
        # languages. None of them are used by an OpenWrt build (the rust toolchain
        # is off in .config), and every gigabyte here is a gigabyte the 72G runner
        # does not have to hand to build_dir.
        sudo rm -rf /home/linuxbrew /home/runner/.cache /home/runner/.cargo \
                    /home/runner/.rustup /home/runner/.dotnet /usr/local/.dotnet \
                    /usr/local/swift /usr/local/lib/heroku /usr/local/heroku \
                    /opt/pipx /opt/pwsh /opt/microsoft/msodbcsql* || true
        echo "=== biggest trees left on the runner ==="
        sudo du -sh /usr/local /usr/lib /usr/share /opt /var /home 2>/dev/null | sort -h | tail -6 || true
        after=$(df --output=avail -BM / | tail -1 | tr -d ' M')
        echo "free space before: ${before} MB, after: ${after} MB"
        df -hT /

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail
        # An apt index fetch from a slow mirror cost 18 minutes in run 40503701918
        # (against 28 seconds the run before). Cap it: the image already ships
        # working lists, so a timeout here costs nothing but a stale index.
        timeout 300 sudo apt-get -qq update || echo "apt update timed out, using the image index"
        sudo apt-get -qq install --no-install-recommends \
          build-essential asciidoc binutils bzip2 gawk gettext \
          libncurses-dev libz-dev patch python3 unzip zlib1g-dev \
          libc6-dev-i386 subversion flex uglifyjs gcc-multilib \
          p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev \
          xmlto qemu-utils upx libelf-dev autoconf automake libtool \
          autopoint device-tree-compiler ccache
        sudo apt-get -qq autoremove --purge
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
    - name: Create working directory
      run: |
        set -euo pipefail
        df -hT
        # / on a hosted runner is small (~14G free); the OpenWrt tree plus dl/
        # needs 25G+. Put it on whichever of / or /mnt has more headroom.
        mnt_free=$(df --output=avail -BM /mnt 2>/dev/null | tail -1 | tr -d ' M' || echo 0)
        root_free=$(df --output=avail -BM / | tail -1 | tr -d ' M')
        if [ "${mnt_free:-0}" -gt "${root_free:-0}" ]; then
          base=/mnt/workdir
        else
          base=/workdir
        fi
        sudo mkdir -p "$base"
        sudo chown "$USER":"$USER" "$base"
        [ "$base" = /workdir ] || sudo ln -sfn "$base" /workdir
        echo "build root: $base ($(df --output=avail -h "$base" | tail -1 | xargs) free)"
        df -hT / /mnt 2>/dev/null || true

    - name: Clone source code
      id: clone
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        # A fresh clone is stamped with the current time, which makes every file in
        # the restored toolchain cache look stale and sends make through a full
        # rebuild: run 40625178150 restored the cache in 40 seconds and then died
        # with "ERROR: toolchain/binutils failed to build" because it was rebuilding
        # binutils inside a build directory that had already been built. Backdating
        # the clone lets the cached stamps and .prepared files win instead.
        files=$(find openwrt -name .git -prune -o -type f -print | wc -l)
        find openwrt -name .git -prune -o -type f -exec touch -t 202001010000 {} + || true
        echo "backdated $files source files to 2020-01-01 so the cache is reused"
        echo "sha=$(git -C openwrt rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Restore the toolchain cache
      # Building tools/ plus the cross toolchain costs 68 minutes of every run
      # (measured: 12:55Z to 14:03Z in run 40503701918) and the result depends on
      # the lede commit only, not on .config. Keep it in the actions cache so the
      # six hour ceiling pays that bill once instead of every time. A miss, a
      # corrupt archive or an eviction is harmless: the next step verifies what
      # landed and the preflight rebuilds anything that is missing.
      id: toolchain-cache
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        # Absolute paths on purpose: the tree lives at /workdir/openwrt with a
        # symlink in the workspace, and an archived symlinked directory is a
        # corner case no one needs in a six hour job.
        path: |
          /workdir/openwrt/staging_dir/host
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/build_dir/host
          /workdir/openwrt/build_dir/hostpkg
          /workdir/openwrt/build_dir/toolchain-*
        key: ow-toolchain-${{ runner.os }}-${{ steps.clone.outputs.sha }}

    - name: Verify the toolchain cache
      id: toolchain-verify
      run: |
        set -euo pipefail
        ok=false
        if [ "${{ steps.toolchain-cache.outputs.cache-hit }}" = "true" ]; then
          cd openwrt
          if ls staging_dir/toolchain-*/lib/ld-musl-*.so* >/dev/null 2>&1 \
             && ls staging_dir/toolchain-*/bin/*-openwrt-linux-musl-gcc >/dev/null 2>&1 \
             && [ -d staging_dir/host/stamp ]; then
            ok=true
            # The archive carries the mtimes it was saved with, so every restored
            # stamp is older than the tree git just cloned and make would rebuild
            # the whole toolchain instead of reusing it. That is exactly how run
            # 40625178150 died: a cache hit, then "ERROR: toolchain/binutils
            # failed to build" in the preflight, because binutils was being
            # rebuilt inside a build directory that was already built.
            stamps=$(find staging_dir -type f -path '*/stamp/*' | wc -l)
            find staging_dir -type f -path '*/stamp/*' -exec touch {} +
            echo "touched $stamps restored stamps so make reuses the cached toolchain"
          else
            echo "::warning::toolchain cache restored but incomplete, discarding it"
            rm -rf staging_dir/host staging_dir/toolchain-* \
                   build_dir/host build_dir/hostpkg build_dir/toolchain-*
          fi
        fi
        echo "ok=$ok" >> "$GITHUB_OUTPUT"
        echo "toolchain cache usable: $ok"

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      #uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      #env:
        #TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        #TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        # make defconfig keeps what .config already pins and fills everything else
        # from defaults, so simply deleting a line is not enough: the passwall
        # includes declare the rust core default-on and it comes straight back.
        # The '# ... is not set' lines in .config pin it off; check that here in
        # seconds instead of finding out three hours into the compile pass.
        if grep -nE '^CONFIG_[A-Z_0-9]*(Shadowsocks_Rust|shadowsocks-rust|PACKAGE_rust)=' .config; then
          echo '::error::the rust toolchain came back after make defconfig and does not fit the six hour job budget'
          exit 1
        fi
        # Same trap for the packages cut for time (the docker stack) or for a real
        # upstream build break (the out-of-tree r8168 driver, and sing-box): the
        # image profile defaults refill whatever .config leaves unspecified.
        # ruby is deliberately absent here: luci-app-openclash depends on it, so
        # its "is not set" pin never survives defconfig and failing on it only
        # costs a seven minute run.
        if grep -nE '^CONFIG_PACKAGE_(kmod-r8168|r8168-rss|docker|dockerd|containerd|runc|sing-box|tuic-client)=' .config; then
          echo '::error::a package cut from the build came back after make defconfig'
          # Say who pulls it back in, otherwise the next run is a guess too.
          echo '--- dependents ---'
          grep -rn --include=Makefile -e 'sing-box' -e 'r8168' feeds package target 2>/dev/null \
            | head -20 || true
          echo '--- selects ---'
          grep -rn -e 'select PACKAGE_sing-box' -e 'select PACKAGE_kmod-r8168' feeds package target 2>/dev/null | head -10 || true
          exit 1
        fi
        echo "rust clocked out: $(grep -c 'is not set' .config) symbols pinned off"
        make download -j8 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Pre-flight oxidns-core
      # The parallel compile pass swallows per-package output, so a bad recipe
      # here would only resurface as a nameless "failed to build" hours later.
      # A package target cannot be built on its own though: package/libs/toolchain
      # wants staging_dir/toolchain-*/lib/ld-musl-*.so*, which only appears after
      # tools/install and toolchain/install. Build those first (the main pass then
      # reuses them), so the verbose package build below actually runs.
      run: |
        cd openwrt
        # Cheap first: unpacking needs no cross toolchain and dies in seconds if
        # the tarball layout and the recipe disagree.
        make package/oxidns-core/prepare V=s
        ls -l build_dir/target-x86_64_musl/oxidns-core-1.6.1 | head -8
        # Unconditional on purpose: with a cache hit the stamps are already in
        # place and both targets return in seconds, while a stale or partial
        # restore still gets rebuilt. Skipping them on a hit would trade 65
        # minutes for a failure mode nobody can debug from the log.
        make -j$(nproc) tools/install
        make -j$(nproc) toolchain/install
        df -hT / | tail -1
        echo "::group::oxidns-core verbose build"
        if ! make package/oxidns-core/compile V=s -j1; then
          echo "::error::oxidns-core failed to compile - see the group above"
          exit 1
        fi
        echo "::endgroup::"
        ls -l build_dir/target-x86_64_musl/oxidns-core*/ipkg-install/usr/bin/ 2>/dev/null || true

    - name: Save the toolchain cache
      # Only when this run built it itself: on a hit the entry already exists and
      # cache/save refuses to overwrite, and the preflight output is the only
      # thing worth keeping (dl/ and build_dir/target-* are run specific).
      if: steps.toolchain-verify.outputs.ok != 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        # Absolute paths on purpose: the tree lives at /workdir/openwrt with a
        # symlink in the workspace, and an archived symlinked directory is a
        # corner case no one needs in a six hour job.
        path: |
          /workdir/openwrt/staging_dir/host
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/build_dir/host
          /workdir/openwrt/build_dir/hostpkg
          /workdir/openwrt/build_dir/toolchain-*
        key: ow-toolchain-${{ runner.os }}-${{ steps.clone.outputs.sha }}

    - name: Compile the firmware
      id: compile
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        df -hT / | tail -1
        du -sh dl staging_dir build_dir tmp 2>/dev/null || true
        # Do NOT delete build_dir/toolchain-*: it looks disposable, but the
        # toolchain phase stamps inside it are what stop gdb/binutils from being
        # rebuilt, and a half-rebuilt binutils dies on as-new (run 40374021452).
        du -sh build_dir/toolchain-* 2>/dev/null | sort -h | tail -3 || true
        df -hT / | tail -1
        # A runner that fills up dies without uploading any log (the run shows
        # "log not found"), taking every diagnostic line with it. Post samples to
        # a tracking issue instead, where they outlive the crash.
        ISS=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=ci-disk&per_page=1" --jq '.[0].number // empty' 2>/dev/null || true)
        if [ -z "${ISS:-}" ]; then
          ISS=$(gh api "repos/$GITHUB_REPOSITORY/issues" \
                  -f title="CI disk telemetry" \
                  -f body="build-openwrt.yml 编译步骤自动追加的磁盘采样，用来定位 runner 磁盘写满（ENOSPC）。" \
                  -f "labels[]=ci-disk" --jq .number 2>/dev/null || true)
        fi
        echo "telemetry issue: ${ISS:-unavailable}"
        # df is cheap, du is not (2 vCPU runner), so sizes every tenth sample.
        (
          i=0
          while true; do
            i=$((i + 1))
            freeg=$(df --output=avail -BM / | tail -1 | tr -d ' M')
            freeg=$((freeg / 1024))
            sample="$(date -u +%H:%M:%SZ) free=${freeg}G"
            if [ $((i % 10)) -eq 0 ]; then
              dl=$(du -sh dl 2>/dev/null | cut -f1)
              staging=$(du -sh staging_dir 2>/dev/null | cut -f1)
              build=$(du -sh build_dir 2>/dev/null | cut -f1)
              rootfs=$(du -sh build_dir/target-*/root-* 2>/dev/null | cut -f1 | tr '\n' ',')
              tmp=$(du -sh tmp 2>/dev/null | cut -f1)
              home=$(du -sh /home/runner 2>/dev/null | cut -f1)
              src=$(du -sh --exclude=build_dir --exclude=staging_dir --exclude=dl --exclude=tmp --exclude=bin . 2>/dev/null | cut -f1)
              sample="$sample dl=$dl staging=$staging build=$build rootfs=$rootfs tmp=$tmp home=$home src=$src"
            fi
            if [ $((i % 20)) -eq 0 ]; then
              heavy=$(du -sm build_dir/*/* 2>/dev/null | sort -rn | head -5 | tr '\n' ' ')
              sample="$sample heavy=[$heavy]"
            fi
            echo "$sample"
            if [ -n "${ISS:-}" ]; then
              gh api "repos/$GITHUB_REPOSITORY/issues/$ISS/comments" -f body="$sample" >/dev/null 2>&1 || true
            fi
            # A tarball in dl/ is read exactly once, when its package unpacks, and
            # is dead weight afterwards: the last run ran out of disk with 4.7G of
            # them sitting there. Anything untouched for 90 minutes has long been
            # unpacked (a re-download would still be correct, just slower).
            # dl/go-mod-cache is left alone: every Go package reads it all pass.
            # Only when space is genuinely short: deleting a tarball early just
            # makes its package re-download it later (the oxidns tarball went
            # through that in run 40503701918).
            if [ $((i % 4)) -eq 0 ] && [ "${freeg}" -lt 12 ]; then
              dl_before=$(du -sm dl 2>/dev/null | cut -f1)
              find dl -maxdepth 1 -type f -mmin +90 -delete 2>/dev/null || true
              dl_after=$(du -sm dl 2>/dev/null | cut -f1)
              echo "$(date -u +%H:%M:%SZ) dl janitor: ${dl_before:-?}M -> ${dl_after:-?}M"
            fi
            sleep 180
          done
        ) &
        # The parallel pass swallows per-package output, so a failure arrives as a
        # one-line "failed to build" with no reason (that is how oxidns-core died
        # 1.5s in). Replay every failed package alone, verbosely, then stop: with
        # a six hour ceiling a serial world retry cannot finish, it just burns the
        # remaining time (run 40503701918 spent its last 14 minutes recompiling
        # the kernel single threaded and produced nothing).
        if ! make -j$(nproc) 2>&1 | tee /tmp/world.log; then
          grep -oE 'package/[A-Za-z0-9._/-]+ failed to build' /tmp/world.log \
            | awk '{print $1}' | sort -u > /tmp/failed.txt || true
          echo "::group::failed packages"
          cat /tmp/failed.txt
          echo "::endgroup::"
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            echo "::group::verbose rebuild $pkg"
            make "$pkg/compile" V=sc -j1 2>&1 | tail -120 || true
            echo "::endgroup::"
          done < /tmp/failed.txt
          df -hT / | tail -1
          du -sh dl build_dir staging_dir tmp 2>/dev/null || true
          echo "::error::world failed - reasons are in the groups above"
          exit 1
        fi
        echo "status=success" >> "$GITHUB_OUTPUT"
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Mark upstream as built
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        set -euo pipefail

        LATEST_SHA=$(gh api "repos/$UPSTREAM_REPO/commits/$UPSTREAM_BRANCH" \
          --jq '.sha')

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -f -a upstream-tracker -m "$LATEST_SHA"
        git push -f origin upstream-tracker
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
        touch release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.1.0
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        #delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
